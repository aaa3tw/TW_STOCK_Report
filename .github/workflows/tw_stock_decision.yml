name: TW_STOCK_DECISION - 決策與結論自動化排程

on:
  schedule:
    # 台灣時間 10:05 (週一至週五) -> UTC 02:05 (避開 :00 整點排隊尖峰)
    - cron: '5 2 * * 1-5'
    # 台灣時間 14:05 (週一至週五) -> UTC 06:05 (避開 :00 整點排隊尖峰)
    - cron: '5 6 * * 1-5'
    # 台灣時間 10:05 (週六) -> UTC 02:05
    - cron: '5 2 * * 6'

  workflow_dispatch:
    inputs:
      mode:
        description: '執行模式 (morning: 早上10點預測 / afternoon: 下午14點結論比對 / weekly: 週六10點勝率統整)'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - afternoon
          - weekly
      custom_stocks:
        description: '自訂股票代號 (逗號分隔，如 2330.TW,2454.TW,8069.TWO，留空則依追蹤清單)'
        required: false
        default: ''
        type: string
      skip_calendar_check:
        description: '略過台股交易日檢查 (測試用)'
        required: false
        default: false
        type: boolean

  repository_dispatch:
    types: [morning, afternoon, weekly]

concurrency:
  group: tw-stock-decision
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-decision-flow:
    name: 執行決策與結論排程
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境 (Setup Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝專案依賴 (Install Dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Google Cloud 身份認證 (Authenticate to Vertex AI)
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: 判斷執行模式 (Determine Mode)
        id: determine_mode
        run: |
          # 1. 若為外部排程 API (repository_dispatch)，直接以 event_type 作為模式 (秒級準時)
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            EVENT_TYPE="${{ github.event.action }}"
            echo "外部 API (repository_dispatch) 觸發模式: $EVENT_TYPE"
            echo "mode=$EVENT_TYPE" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 2. 若為手動觸發 (workflow_dispatch)，優先使用輸入參數
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手動觸發指定模式: ${{ github.event.inputs.mode }}"
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 2. 排程觸發：直接比對觸發此任務的 cron 表達式 (免疫 Runner 佇列延遲)
          SCHEDULE="${{ github.event.schedule }}"
          echo "GitHub 排程 Cron 表達式: '$SCHEDULE'"

          case "$SCHEDULE" in
            *" 2 * * 6"*)
              echo "匹配週六 10:00 統計排程 -> weekly"
              echo "mode=weekly" >> $GITHUB_OUTPUT
              exit 0
              ;;
            *" 2 * * 1-5"*)
              echo "匹配平日 10:00 早盤預測排程 -> morning"
              echo "mode=morning" >> $GITHUB_OUTPUT
              exit 0
              ;;
            *" 6 * * 1-5"*)
              echo "匹配平日 14:00 盤後結論排程 -> afternoon"
              echo "mode=afternoon" >> $GITHUB_OUTPUT
              exit 0
              ;;
          esac

          # 3. 備援判定：若 schedule 變數未匹配，依台灣時間小時判斷 (13:00 前一律為 morning)
          TW_HOUR=$(TZ="Asia/Taipei" date +%-H)
          TW_DOW=$(TZ="Asia/Taipei" date +%u)
          echo "備援判定時間：台灣時間 ${TW_HOUR} 點 (星期 ${TW_DOW})"

          if [ "$TW_DOW" -eq 6 ]; then
            echo "mode=weekly" >> $GITHUB_OUTPUT
          elif [ "$TW_HOUR" -lt 13 ]; then
            echo "mode=morning" >> $GITHUB_OUTPUT
          else
            echo "mode=afternoon" >> $GITHUB_OUTPUT
          fi

      - name: 執行 TW_STOCK_DECISION 核心引擎
        env:
          GOOGLE_GENAI_USE_VERTEXAI: ${{ env.GCP_SA_KEY != '' && 'true' || 'false' }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT || 'project-58555ecd-7677-4675-8a4' }}
          GOOGLE_CLOUD_LOCATION: ${{ vars.GOOGLE_CLOUD_LOCATION || 'us-central1' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DECISION_API_KEY: ${{ secrets.DECISION_API_KEY || 'sk-vsr-I32xzgP5bIpaiXRXFLQkG5T3UDhEhyglqMgAk0deWQY' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FINMIND_API_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
        run: |
          MODE="${{ steps.determine_mode.outputs.mode }}"
          echo "當前排程執行模式: $MODE"
          
          FLAGS="--mode $MODE"
          
          if [ "${{ github.event.inputs.skip_calendar_check }}" = "true" ]; then
            FLAGS="$FLAGS --skip-calendar-check"
          fi
          
          if [ -n "${{ github.event.inputs.custom_stocks }}" ]; then
            FLAGS="$FLAGS --custom-stocks ${{ github.event.inputs.custom_stocks }}"
          fi

          if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            FLAGS="$FLAGS --webhook-url ${{ secrets.DISCORD_WEBHOOK_URL }}"
          fi

          python src/decision/runner.py $FLAGS

      - name: 同步結論資料庫 (Commit & Push Decision DB)
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/decisions.db || true
          if git diff --staged --quiet; then
            echo "資料庫無變更，略過同步。"
          else
            git commit -m "chore(db): 自動記錄最新決策與結論數據 [skip ci]"
            git push origin HEAD || true
          fi
