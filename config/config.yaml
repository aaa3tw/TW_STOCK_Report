# 系統參數與量化風控閾值設定 (System & Risk Thresholds)

system:
  app_name: "台股盤前法人級全維度決策報表"
  version: "1.0.0"
  timezone: "Asia/Taipei"

# AI 分析模型設定
gemini:
  model: "gemini-3.8-flash"
  fallback_model: "gemini-2.5-flash"
  temperature: 0.2
  max_output_tokens: 3000

# 量化風控雷達閾值
risk_thresholds:
  # 董監質押比率 (%)
  pledge_danger: 50.0       # > 50% 🔴 高危險斷頭區
  pledge_warning: 30.0      # 30%~50% 🟡 槓桿警示

  # 當沖成交比率 (%)
  day_trading_danger: 55.0   # > 55% 🔴 極度過熱、籌碼混亂
  day_trading_warning: 40.0  # 40%~55% 🟡 波動加劇警示

  # 真假營收陷阱: 存貨天數 (DIO) 與應收帳款天數 (DSO) 年增率 (%)
  dio_growth_alarm: 25.0     # 存貨週轉天數年增 > 25% 警示塞貨
  dso_growth_alarm: 25.0     # 應收帳款週轉天數年增 > 25% 警示倒帳/未能收現

  # 可轉債 (CB) 轉換套利判定
  cb_parity_arbitrage: 105.0 # 平價 (股價/轉換價*100) > 105% 易引發放空套利賣壓
  cb_discount_opportunity: 95.0 # 接近到期或賣回日且平價 < 95% 有潛在拉抬誘因

  # 隔日沖分點買超佔比門檻 (%)
  flipper_net_buy_share: 15.0 # 隔日沖券商淨買超佔全日成交量逾 15% 警示開高走低

