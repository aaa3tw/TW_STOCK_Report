# Discord 限制與推播設定
discord:
  max_embeds_per_post: 10   # Discord 單則訊息上限 10 個 Embed
  max_characters_total: 5800 # Discord 單則訊息總字數上限 6000 (預留緩衝)
  colors:
    green: 0x2ECC71         # 🟢 買入 / 多方強勢
    yellow: 0xF1C40F        # 🟡 觀望等待 / 中立
    red: 0xE74C3C           # 🔴 賣出 / 避開 / 高風險
    blue: 0x3498DB          # 🌐 大盤總覽
